<script>
(function () {
    if (window.__searchStarted) return;
    window.__searchStarted = true;

    var ROOT = "/";
    var MAX_RESULTS = 12;

    var mask, input, body, items = [], active = -1, index = null, loading = false;

    function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    }

    function mark(text, q) {
        var safe = esc(text);
        if (!q) return safe;
        var lower = safe.toLowerCase();
        var out = "", i = 0, pos;
        while ((pos = lower.indexOf(q, i)) >= 0) {
            out += safe.slice(i, pos) + "<mark>" + safe.slice(pos, pos + q.length) + "</mark>";
            i = pos + q.length;
        }
        return out + safe.slice(i);
    }

    function build() {
        mask = document.createElement("div");
        mask.id = "search-mask";
        mask.className = "hidden";

        var panel = document.createElement("div");
        panel.id = "search-panel";

        var head = document.createElement("div");
        head.className = "sp-head";
        head.innerHTML = '<i class="fa-solid fa-magnifying-glass fa-fw"></i>';

        input = document.createElement("input");
        input.className = "sp-input";
        input.type = "text";
        input.placeholder = "搜索文章标题、标签、正文…";
        input.setAttribute("autocomplete", "off");
        head.appendChild(input);

        var close = document.createElement("button");
        close.className = "sp-close";
        close.textContent = "ESC";
        close.addEventListener("click", function () { hide(); });
        head.appendChild(close);
        panel.appendChild(head);

        body = document.createElement("div");
        body.className = "sp-body";
        body.innerHTML = '<div class="sp-empty">输入关键词开始搜索</div>';
        panel.appendChild(body);

        var foot = document.createElement("div");
        foot.className = "sp-foot";
        foot.innerHTML = "<kbd>↑</kbd><kbd>↓</kbd> 选择 · <kbd>Enter</kbd> 打开 · <kbd>Esc</kbd> 关闭";
        panel.appendChild(foot);

        mask.appendChild(panel);
        mask.addEventListener("click", function (e) {
            if (e.target === mask) hide();
        });
        document.body.appendChild(mask);

        input.addEventListener("input", function () { run(); });
        input.addEventListener("keydown", function (e) {
            if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
            else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
            else if (e.key === "Enter") {
                e.preventDefault();
                var it = items[active >= 0 ? active : 0];
                if (it) window.location.href = it.post.url;

        });
    }

    function loadIndex() {
        if (index || loading) return;
        loading = true;
        fetch(ROOT + "search.json")
            .then(function (r) { return r.json(); })
            .then(function (data) {
                index = data && data.posts ? data.posts : [];

                if (input.value.trim()) run();

                loading = false;
                body.innerHTML = '<div class="sp-empty">搜索索引加载失败，刷新页面再试试</div>';

    function query(q) {
        q = q.trim().toLowerCase();
        if (!q) return [];
        var out = [];
        for (var i = 0; i < index.length; i++) {
            var p = index[i];
            var title = String(p.title || "");
            var meta = (p.tags || []).join(" ") + " " + (p.categories || []).join(" ");

            var score = 0, snippet = "";
            if (title.toLowerCase().indexOf(q) >= 0) score += 100;
            if (meta.toLowerCase().indexOf(q) >= 0) score += 60;

            if (at >= 0) {
                score += 20;
                snippet = text.slice(Math.max(0, at - 26), at + 76).trim();

            }
            if (score > 0) out.push({ post: p, score: score, snippet: snippet, q: q });
        }
        out.sort(function (a, b) { return b.score - a.score; });
        return out.slice(0, MAX_RESULTS);
    }

    function run() {
        var q = input.value;
        if (!index) { loadIndex(); return; }
        if (!q.trim()) {
            items = [];
            active = -1;
            body.innerHTML = '<div class="sp-empty">输入关键词开始搜索</div>';
            return;

        items = query(q);

        if (!items.length) {
            body.innerHTML = '<div class="sp-empty">没有找到和「' + esc(q.trim()) + '」相关的内容</div>';
            return;

                '<div class="sp-title">' + mark(p.title, it.q) + "</div>" +
                '<div class="sp-meta">' + esc(metaBits.join(" · ")) + "</div>" +

                "</a>";
        }
        body.innerHTML = html;
    }

    function move(step) {

        var nodes = body.querySelectorAll(".sp-item");
        for (var i = 0; i < nodes.length; i++) nodes[i].classList.toggle("active", i === active);

        document.documentElement.style.overflow = "hidden";
        loadIndex();
        input.value = "";
        items = [];
        active = -1;
        body.innerHTML = '<div class="sp-empty">输入关键词开始搜索</div>';
        setTimeout(function () { input.focus(); }, 30);
    }

    function hide() {
        if (!mask) return;
        mask.classList.add("hidden");
        document.documentElement.style.overflow = "";
    }

    function init() {
        var tools = window.__navTools;
        var btn = document.getElementById("search-btn");
        if (!btn && tools) {
            btn = document.createElement("a");
            btn.id = "search-btn";
            btn.innerHTML = '<i class="fa-solid fa-magnifying-glass fa-fw"></i>';
            btn.title = "搜索文章（Ctrl + K）";
            tools.insertBefore(btn, tools.firstChild);
        }
        if (btn) btn.addEventListener("click", function (e) { e.preventDefault(); show(); });

        var m = document.getElementById("appearance-search-mobile");
        if (m) m.addEventListener("click", function (e) { e.preventDefault(); show(); });

        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") { hide(); return; }
            if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) {
                e.preventDefault();
                if (mask && !mask.classList.contains("hidden")) hide();
                else show();
            }
        });
    }

    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
})();
